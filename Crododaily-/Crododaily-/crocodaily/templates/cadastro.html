
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CrocoDaily - Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>
<body>

    <h1>Criar conta</h1>

    <form action="{{ url_for('cadastro') }}" method="POST">

        <input
            type="text"
            name="usuario"
            placeholder="Usuário"
            required>

        <input
            type="password"
            name="senha"
            placeholder="Senha"
            required>

        <button type="submit">Cadastrar</button>

    </form>

    {% if erro %}
        <p>{{ erro }}</p>
    {% endif %}

    <a href="{{ url_for('login') }}">Voltar ao login</a>

</body>
</html>
